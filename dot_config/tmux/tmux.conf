# tmux config. Ported verbatim from bootstrap.sh:805-856 (Phase 7).
# Only applied for standard/full scope — see .chezmoiignore. TPM and the plugins
# below are installed by run_onchange_after_30-install-tpm.sh.tmpl.

# Colours / mouse
set-option -sa terminal-overrides ",xterm*:Tc"
set -g mouse on

# Index from 1, renumber on close
set -g base-index 1
set -g pane-base-index 1
set-window-option -g pane-base-index 1
set-option -g renumber-windows on

# Split in current working directory
bind '"' split-window -v -c "#{pane_current_path}"
bind %  split-window -h -c "#{pane_current_path}"

# Mouse-wheel: behave like a normal terminal (scrollback in shells, arrows in pagers)
bind -T root WheelUpPane \
  if-shell -F -t = '#{?mouse_any_flag,1,#{pane_in_mode}}' \
    'send -M' \
    'if-shell -F -t = "#{alternate_on}" "send -N 3 Up" "copy-mode -e"'
bind -T root WheelDownPane \
  if-shell -F -t = '#{?mouse_any_flag,1,#{pane_in_mode}}' \
    'send -M' \
    'if-shell -F -t = "#{alternate_on}" "send -N 3 Down" "send -M"'

# Plugins ( $HOME, not ~, so the path resolves in set-environment )
set-environment -g TMUX_PLUGIN_MANAGER_PATH "$HOME/.config/tmux/plugins"
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
# Pinned to v0.3.0 — uses the OLD @catppuccin_* API.
# If you ever bump to v1.0+, the config syntax below MUST be rewritten.
set -g @plugin 'catppuccin/tmux#v0.3.0'

set -g @catppuccin_flavor 'mocha' # mocha, macchiato, frappe, or latte
set -g @catppuccin_window_left_separator ""
set -g @catppuccin_window_right_separator " "
set -g @catppuccin_window_middle_separator " █"
set -g @catppuccin_window_number_position "right"
set -g @catppuccin_window_default_fill "number"
set -g @catppuccin_window_default_text "#W"
set -g @catppuccin_window_current_fill "number"
set -g @catppuccin_window_current_text "#W"
set -g @catppuccin_status_modules_right "directory session"
set -g @catppuccin_status_left_separator " "
set -g @catppuccin_status_right_separator ""
set -g @catppuccin_status_right_separator_inverse "no"
set -g @catppuccin_status_fill "icon"
set -g @catppuccin_status_connect_separator "no"
set -g @catppuccin_directory_text "#{pane_current_path}"

run '~/.config/tmux/plugins/tpm/tpm'
